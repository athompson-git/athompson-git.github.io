<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beam Energy vs. POT Bubble Plot</title>
  <link rel="stylesheet" href="styles.css?v=link-policy">
  <!-- jQuery for JSON loading -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Chart.js library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
  <div class="page-frame">
    <header class="site-header">
      <nav class="banner-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="experiments.html">eXdb</a>
      </nav>
      <h1 class="page-title">Beam Energy vs. POT Bubble Plot</h1>
    </header>
    <main class="site-main">
      <canvas id="bubbleChart" role="img" aria-label="Bubble plot of beam energy in GeV versus planned or largest protons on target"></canvas>
    </main>
  </div>
  
  <script>
    $(document).ready(async function() {
      await document.fonts.ready;
      const theme = getComputedStyle(document.body);
      Chart.defaults.font.family = theme.getPropertyValue('--font-site').trim();
      Chart.defaults.color = theme.getPropertyValue('--color-ink').trim();
      $.getJSON("data/experiments.json")
        .done(function(data) {
          // Remove the field_types entry if present.
          delete data.field_types;
          
          const dataPoints = Object.values(data).flatMap(details => {
            const beamEnergy = Number(details["Beam Energy (GeV)"]);
            const pot = Number(details["POT (Planned/Largest)"] ?? details.POT);
            if (!Number.isFinite(beamEnergy) || !Number.isFinite(pot) || beamEnergy <= 0 || pot <= 0) {
              return [];
            }
            return [{ x: beamEnergy, y: pot, r: 5 }];
          });

          // Create the bubble chart
          var ctx = document.getElementById('bubbleChart').getContext('2d');
          var bubbleChart = new Chart(ctx, {
            type: 'bubble',
            data: {
              datasets: [{
                label: 'Beam Energy vs POT',
                data: dataPoints,
                backgroundColor: 'rgba(3, 94, 123, 0.45)',
                borderColor: theme.getPropertyValue('--color-link').trim(),
                borderWidth: 1
              }]
            },
            options: {
              scales: {
                x: {
                  type: 'logarithmic',
                  title: {
                    display: true,
                    text: 'Beam Energy (GeV)'
                  }
                },
                y: {
                  type: 'logarithmic',
                  title: {
                    display: true,
                    text: 'POT (Planned/Largest)'
                  }
                }
              },
              plugins: {
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      return 'Beam Energy: ' + context.raw.x + 
                             ', POT: ' + context.raw.y;
                    }
                  }
                }
              }
            }
          });
        })
        .fail(function(jqxhr, textStatus, error) {
          console.error("Error loading JSON:", textStatus, error);
        });
    });
  </script>
</body>
</html>
