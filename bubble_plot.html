<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="theme.js?v=local-time"></script>
  <title>Beam Energy vs. POT Bubble Plot</title>
  <link rel="stylesheet" href="styles.css?v=sage-section-labels">
  <!-- jQuery for JSON loading -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Chart.js library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    #bubbleChart {
      --plot-text: var(--color-ink);
      --plot-point-fill: rgba(3, 94, 123, 0.45);
      --plot-grid: rgba(0, 0, 0, 0.1);
    }

    :root[data-theme="dark"] #bubbleChart {
      --plot-text: var(--color-cream);
      --plot-point-fill: rgba(227, 231, 175, 0.45);
      --plot-grid: var(--color-rule);
    }
  </style>
</head>
<body>
  <div class="page-frame">
    <header class="site-header">
      <nav class="banner-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="experiments.html">eXdb</a>
      </nav>
      <h1 class="page-title">Beam Energy vs. POT Bubble Plot</h1>
    </header>
    <main class="site-main">
      <canvas id="bubbleChart" role="img" aria-label="Bubble plot of beam energy in GeV versus planned or largest protons on target"></canvas>
    </main>
  </div>
  
  <script>
    $(document).ready(async function() {
      await document.fonts.ready;
      $.getJSON("data/experiments.json")
        .done(function(data) {
          // Remove the field_types entry if present.
          delete data.field_types;
          
          const dataPoints = Object.values(data).flatMap(details => {
            const beamEnergy = Number(details["Beam Energy (GeV)"]);
            const pot = Number(details["POT (Planned/Largest)"] ?? details.POT);
            if (!Number.isFinite(beamEnergy) || !Number.isFinite(pot) || beamEnergy <= 0 || pot <= 0) {
              return [];
            }
            return [{ x: beamEnergy, y: pot, r: 5 }];
          });

          const canvas = document.getElementById('bubbleChart');
          const theme = getComputedStyle(canvas);
          const themeValue = name => theme.getPropertyValue(name).trim();

          function applyThemeDefaults() {
            Chart.defaults.color = themeValue('--plot-text');
            Chart.defaults.borderColor = themeValue('--plot-grid');
          }

          Chart.defaults.font.family = themeValue('--font-site');
          applyThemeDefaults();

          const dataset = {
            label: 'Beam Energy vs POT',
            data: dataPoints,
            backgroundColor: themeValue('--plot-point-fill'),
            borderColor: themeValue('--color-link'),
            borderWidth: 1
          };
          const bubbleChart = new Chart(canvas, {
            type: 'bubble',
            data: {
              datasets: [dataset]
            },
            options: {
              scales: {
                x: {
                  type: 'logarithmic',
                  title: {
                    display: true,
                    text: 'Beam Energy (GeV)'
                  }
                },
                y: {
                  type: 'logarithmic',
                  title: {
                    display: true,
                    text: 'POT (Planned/Largest)'
                  }
                }
              },
              plugins: {
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      return 'Beam Energy: ' + context.raw.x + 
                             ', POT: ' + context.raw.y;
                    }
                  }
                }
              }
            }
          });

          window.addEventListener('site-theme-change', () => {
            applyThemeDefaults();
            dataset.backgroundColor = themeValue('--plot-point-fill');
            dataset.borderColor = themeValue('--color-link');
            for (const axis of Object.values(bubbleChart.config.options.scales)) {
              axis.ticks.color = Chart.defaults.color;
              axis.title.color = Chart.defaults.color;
              axis.grid.color = Chart.defaults.borderColor;
              axis.grid.tickColor = Chart.defaults.borderColor;
              axis.border.color = Chart.defaults.borderColor;
            }
            bubbleChart.update('none');
          });
        })
        .fail(function(jqxhr, textStatus, error) {
          console.error("Error loading JSON:", textStatus, error);
        });
    });
  </script>
</body>
</html>
